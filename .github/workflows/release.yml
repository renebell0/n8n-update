name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # Required for OIDC and SLSA Provenance

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        continue-on-error: true # Don't block release on style warnings
      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@v1.1
        with:
          path: .
          recurse: true
        continue-on-error: true # Don't block release on style warnings

  publish-npm:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing doesn't need NPM_TOKEN secret. 
      # npm will use the OIDC token provided by GitHub.
      - run: npm publish --provenance --access public

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            install.ps1
            install.sh
            update-n8n.ps1
            update-n8n.sh
          generate_release_notes: true
